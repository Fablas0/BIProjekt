name: Taeglicher ETL-Lauf

# Betriebslauf, getrennt von der Pruefpipeline in ci.yml.
#
# Pokemon Champions haelt nur rund zwei Wochen Tagesstaende vor. Faellt ein Tag
# aus der Quelle, ist er endgueltig verloren. Der Lauf sichert deshalb taeglich
# die Rohnutzlast des neuen Tages.
#
# Was hier archiviert wird, sind ausschliesslich die **Rohdaten** -- nicht die
# Datenbank. Das Data Warehouse ist daraus jederzeit neu ableitbar, die
# Rohnutzlast dagegen nicht wiederbeschaffbar. Gemessen fallen rund 0,3 MB je
# Tag an (gzip-komprimiert), also etwa 110 MB im Jahr.
#
# ABSCHALTUNG: GitHub deaktiviert einen geplanten Workflow nach 60 Tagen ohne
# Aktivitaet im Repository. Die Commits des Bots aus diesem Lauf zaehlen dabei
# ausdruecklich nicht mit. Der Zeitplan ist derzeit bis zum **02.11.2026**
# gesichert; bis dahin muss ein eigener Commit oder ein Start ueber
# "Run workflow" erfolgt sein. Danach faellt der Lauf still aus -- und ein
# nicht abgeholter Tag ist nach der Vorhaltezeit der Quelle verloren.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      max_tage:
        description: "Nur die juengsten N Tage abrufen (leer = alle verfuegbaren)"
        required: false
        default: ""

# Der Job schreibt das Archiv in das Repository zurueck.
permissions:
  contents: write

jobs:
  archivieren:
    name: Tagesstand sichern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      # Anders als in der Pruefpipeline faerbt ein Quellausfall (Exit 75) diesen
      # Lauf bewusst rot: ein nicht abgeholter Tag ist nach der Vorhaltezeit
      # endgueltig verloren, das muss auffallen.
      - name: ETL ausfuehren
        id: etl
        env:
          MAX_TAGE: ${{ inputs.max_tage }}
          # Kostenloser Schluessel der Limitless-API (play.limitlesstcg.com).
          # Ohne ihn wird die TCG-Strecke uebersprungen und als Befund
          # ausgewiesen -- der Lauf bleibt gruen.
          VGC_BI_TCG_SCHLUESSEL: ${{ secrets.VGC_BI_TCG_SCHLUESSEL }}
        run: |
          if [ -n "$MAX_TAGE" ]; then
            python -m scripts.etl_lauf --max-tage "$MAX_TAGE"
          else
            python -m scripts.etl_lauf
          fi

      - name: Rohdaten exportieren
        # Laeuft auch nach einem Teilfehler: was geladen wurde, soll gesichert
        # werden. Der Export ist deterministisch sortiert, damit unveraenderte
        # Tage keinen neuen Commit erzeugen.
        if: always()
        run: python -m scripts.archiv_export

      - name: Archiv festschreiben
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all archiv
          if git diff --cached --quiet; then
            echo "Keine neuen Tagesstaende -- nichts festzuschreiben."
            exit 0
          fi
          git commit -m "Archiv: Tagesstand $(date -u +%Y-%m-%d) gesichert"
          # Ein zwischenzeitlicher Push auf main darf den Archiv-Commit nicht
          # verwerfen; deshalb rebasen und erneut versuchen.
          for versuch in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push-Versuch $versuch fehlgeschlagen, erneut ..."
            sleep 5
          done
          exit 1

      - name: Qualitaetstor
        # Erst nach der Sicherung: ein Qualitaetsmangel darf nicht dazu fuehren,
        # dass ein unwiederbringlicher Tagesstand verloren geht.
        #
        # Ohne Angabe gilt bi.quality.MINDESTINDEX -- die Schwelle stand zuvor
        # als Zahl in beiden Workflows und in der Oberflaeche, drei Stellen, die
        # auseinanderlaufen konnten. Das Tor bewertet die eigene Verarbeitung:
        # ein von der Quelle angebotener, aber nicht geholter Tag faerbt den
        # Lauf rot. Veroeffentlicht die Quelle selbst nichts mehr, erscheint das
        # als Warnung am Lauf -- ein fremder Ausfall ist nicht durch einen
        # erneuten Lauf zu beheben und darf das Tor nicht dauerhaft schliessen.
        run: python -m scripts.qualitaet_pruefen --annotationen

      - name: Hypothesenkatalog
        # Informativ, kein Tor: ein beibehaltenes H0 ist ein Ergebnis, kein
        # Fehler. Der Bericht haelt fest, wie sich die Befunde mit wachsender
        # Zeitreihe entwickeln.
        if: always()
        run: python -m scripts.hypothesen_pruefen --kurz || true

      - name: Zusammenfassung im Lauf hinterlegen
        if: always()
        run: |
          {
            echo "## Taeglicher ETL-Lauf"
            echo ""
            echo '```'
            python -m scripts.qualitaet_pruefen --mindestindex 0 || true
            echo '```'
            echo ""
            echo "## Hypothesenpruefung"
            echo ""
            echo '```'
            python -m scripts.hypothesen_pruefen --kurz || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
