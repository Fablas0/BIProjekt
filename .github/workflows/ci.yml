name: CI

# Qualitaetssicherung bei jeder Aenderung: statische Pruefung, Tests und ein
# Integrationslauf gegen die echten Quellsysteme.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Statische Codepruefung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-dev.txt

      # Die tatsaechlich verwendeten Versionen protokollieren. Ein Befund, der
      # lokal nicht auftritt, ist fast immer ein Versionsunterschied -- ohne
      # dieses Protokoll ist das aus dem Fehlerbericht nicht ablesbar.
      - name: Versionen protokollieren
        run: |
          python --version
          ruff --version
          pip freeze

      - name: Ruff (Linting und Importsortierung)
        run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Unit- und Integrationstests
        # Die Oberflaechentests ueberspringen sich selbst, solange kein
        # befuelltes Data Warehouse vorliegt.
        run: pytest -q --tb=short

  etl-integration:
    name: ETL gegen die Quellsysteme
    runs-on: ubuntu-latest
    # Nur auf dem Hauptzweig: der Lauf greift auf externe Dienste zu und soll
    # Pull Requests nicht von deren Verfuegbarkeit abhaengig machen.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-dev.txt

      # Der Lauf liest zuerst das mitversionierte Rohdatenarchiv ein und ergaenzt
      # es um die juengsten Tage der Quelle. Ein Ausfall des Quellsystems (Exit 75)
      # ist kein Codefehler und darf die Codepruefung nicht rot faerben -- die
      # nachfolgenden Schritte entfallen dann, weil kein Warehouse vorliegt.
      - name: Data Warehouse aufbauen
        id: etl
        run: |
          set +e
          python -m scripts.etl_lauf --max-tage 3
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "quelle=aus" >> "$GITHUB_OUTPUT"
            echo "::warning title=Quellsystem nicht erreichbar::Der Integrationslauf wurde uebersprungen."
            exit 0
          fi
          echo "quelle=an" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Datenqualitaet pruefen
        if: steps.etl.outputs.quelle == 'an'
        # Bricht ab, wenn der Qualitaetsindex unter den Schwellwert faellt.
        # Massgeblich ist bi.quality.MINDESTINDEX -- dieselbe Zahl, an der die
        # Oberflaeche die Kachel des Qualitaetsindex einfaerbt. Fremde Umstaende
        # -- etwa eine Quelle, die nichts Neues veroeffentlicht -- erscheinen
        # als Warnung, nicht als Fehler.
        run: python -m scripts.qualitaet_pruefen --annotationen

      - name: Oberflaechentests gegen das befuellte Warehouse
        # Erst hier laufen sie wirklich: ohne Datenbank ueberspringen sie sich
        # selbst, weshalb die Matrix-Jobs oben sie faktisch nicht pruefen.
        if: steps.etl.outputs.quelle == 'an'
        run: pytest tests/test_oberflaeche.py -q --tb=short

      - name: Data Warehouse als Artefakt sichern
        if: steps.etl.outputs.quelle == 'an'
        uses: actions/upload-artifact@v4
        with:
          name: vgc-dwh
          path: data/vgc_dwh.db
          retention-days: 7
