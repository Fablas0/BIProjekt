[project]
name = "vgc-bi"
version = "1.0.0"
description = "Business-Intelligence-Loesung fuer das kompetitive Pokemon-VGC-Metagame"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
